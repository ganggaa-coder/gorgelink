<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script>
      // Suppress Vite HMR WebSocket errors in AI Studio iframe environment
      (function() {
        const OrigWebSocket = window.WebSocket;
        if (OrigWebSocket) {
          window.WebSocket = function(url, protocols) {
            const isViteHmr =
              (typeof protocols === 'string' && (protocols === 'vite-hmr' || protocols === 'vite-ping')) ||
              (Array.isArray(protocols) && (protocols.includes('vite-hmr') || protocols.includes('vite-ping'))) ||
              (typeof url === 'string' && (url.includes('token=') || url.includes(':24678') || url.includes('vite-hmr')));

            if (isViteHmr) {
              const target = new EventTarget();
              const fakeWs = {
                readyState: 1, // OPEN
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                send: function() {},
                close: function() {},
                addEventListener: target.addEventListener.bind(target),
                removeEventListener: target.removeEventListener.bind(target),
                dispatchEvent: target.dispatchEvent.bind(target),
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
              };
              setTimeout(() => {
                const openEvt = new Event('open');
                if (typeof fakeWs.onopen === 'function') fakeWs.onopen(openEvt);
                fakeWs.dispatchEvent(openEvt);
              }, 0);
              return fakeWs;
            }
            return new OrigWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        window.addEventListener('unhandledrejection', function(event) {
          const reason = event.reason;
          const msg = reason?.message || String(reason || '');
          const stack = reason?.stack || '';
          if (
            msg.includes('WebSocket') ||
            stack.includes('@vite/client') ||
            stack.includes('createWebSocketModuleRunnerTransport')
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          const msg = event.message || '';
          const file = event.filename || '';
          const stack = event.error?.stack || '';
          if (
            msg.includes('WebSocket') ||
            file.includes('@vite/client') ||
            stack.includes('@vite/client') ||
            stack.includes('createWebSocketModuleRunnerTransport')
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
    <title>GorgeLink - MEDIA Downloader</title>
